[package]
name = "freetokenmeter"
version = "0.1.0"
description = "A lightweight desktop widget that monitors AI token usage"
authors = ["you"]
edition = "2021"

[lib]
name = "freetokenmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
log = { version = "0.4", features = ["std"] }
ureq = "2"

[profile.release]
# Deliberately `unwind`: the sync manager runs every provider fetch inside
# `catch_unwind` so one malformed local file cannot take the widget down. With
# `panic = "abort"` that isolation would silently stop working in release builds.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
